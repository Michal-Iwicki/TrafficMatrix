const pts=[{"c": 5, "name": "Mory / S8", "cat": "wezel_drogowy", "ev": 690, "lat": 52.21702975362319, "lon": 20.86463936231884, "why": "Nazwa 'Mory / S8' odnosi się do węzła drogowego S8 Warszawa Zachód, co potwierdzają pobliskie POI typu motorway_junction.", "col": "#f4a261"}, {"c": 19, "name": "Marki / Głębocka S8", "cat": "mieszane", "ev": 568, "lat": 52.30769617957747, "lon": 21.095983661971832, "why": "Rejon jest zlokalizowany przy węźle S8 Marki, co potwierdzają POI 'Marki' oraz bliskość dużych obiektów handlowych jak M1 Marki i Aldi.", "col": "#8d99ae"}, {"c": 3, "name": "Bielany Gwiaździsta", "cat": "transport_publiczny", "ev": 467, "lat": 52.2918147751606, "lon": 20.973781092077086, "why": "Obszar ten jest zlokalizowany przy pętli autobusowej Gwiaździsta w Bielanach, co potwierdzają liczne przystanki i stacja autobusowa.", "col": "#1d3557"}, {"c": 13, "name": "Żoliborz Centrum Olimpijskie", "cat": "rekreacja", "ev": 395, "lat": 52.26967496202531, "lon": 20.998876101265825, "why": "Rejon znajduje się w Żoliborzu przy Centrum Olimpijskim, co potwierdzają pobliskie przystanki o tej samej nazwie oraz bliskość Akademii Koźmińskiego.", "col": "#52b788"}, {"c": 21, "name": "Koło / Lasek", "cat": "mieszkaniowa", "ev": 342, "lat": 52.25455725146199, "lon": 20.9526866374269, "why": "Nazwa 'Koło / Lasek' odnosi się do osiedla Koło i pobliskiego lasku, co potwierdzają przystanki 'Lasek na Kole' i ogólna zabudowa mieszkalna.", "col": "#2a9d8f"}, {"c": 0, "name": "Galeria Modlińska / Tarchomin", "cat": "handel", "ev": 252, "lat": 52.303673611111115, "lon": 20.988980357142857, "why": "Rejon jest skoncentrowany wokół Galerii Modlińskiej, co potwierdzają liczne supermarkety (Lidl, Aldi) i stacje paliw w bliskiej odległości.", "col": "#e63946"}, {"c": 25, "name": "Bemowo / Górczewska", "cat": "mieszkaniowa", "ev": 139, "lat": 52.24090654676259, "lon": 20.896438920863307, "why": "Obszar położony jest w Bemowie przy Osiedlu Górczewska, co potwierdzają liczne przystanki komunik permarketów.", "col": "#2a9d8f"}, {"c": 2, "name": "Targówek / Głębocka", "cat": "handel", "ev": 52, "lat": 52.30739307692308, "lon": 21.05415846153846, "why": "Obszar położony jest w Targówku przy ul. Głębockiej, na co wskazują liczne markety (Carrefour, Lidl, Aldi) i centrum handlowe G City Targówek.", "col": "#e63946"}, {"c": 6, "name": "Targówek Homepark Marki", "cat": "handel", "ev": 48, "lat": 52.307179166666664, "lon": 21.08157, "why": "Rejon zlokalizowany jest w pobliżu centrów handlowych Homepark Targówek, Auchan i M1 Marki, co jednoznacznie wskazuje na dominującą funkcję handlową.", "col": "#e63946"}, {"c": 9, "name": "Bemowo / Obrońców Tobruku", "cat": "mieszkaniowa", "ev": 44, "lat": 52.26548068181818, "lon": 20.94461613636364, "why": "Obszar położony jest w Bemowie, przy ulicy Obrońców Tobruku, co potwierdzają pobliskie przystanki komunikacji miejskiej, wskazując na dominującą funkcję mieszkalną.", "col": "#2a9d8f"}, {"c": 27, "name": "Bródno / Metro Bródno", "cat": "mieszane", "ev": 43, "lat": 52.29641976744187, "lon": 21.033088372093022, "why": "Rejon Bródno znajduje się w bezpośrednim sąsiedztwie stacji metra Bródno, co potwierdzają liczne supermarkety, uczelnia i przystanki komunikacji miejskiej.", "col": "#8d99ae"}, {"c": 22, "name": "Powązki / Broniewskiego", "cat": "wezel_drogowy", "ev": 40, "lat": 52.26191250000001, "lon": 20.95301325, "why": "Rejon zlokalizowany jest przy węźle drogowym Broniewskiego oraz w pobliżu Cmentarza Wojskowego na Powązkach, co potwierdzają pobliskie przystanki i POI.", "col": "#f4a261"}, {"c": 15, "name": "Żoliborz / ChZT", "cat": "mieszane", "ev": 39, "lat": 52.2699758974359, "lon": 20.952070256410256, "why": "Rejon położony jest w Żoliborzu, w pobliżu Chrześcijańskiej Akademii Teologicznej, otoczonej osiedlami mieszkalnymi i lokalnymi supermarketami.", "col": "#8d99ae"}, {"c": 14, "name": "Targówek / Bartnicza", "cat": "handel", "ev": 38, "lat": 52.28494894736842, "lon": 21.02311763157895, "why": "Rejon zlokalizowany omunikacji miejskiej.", "col": "#1d3557"}, {"c": 7, "name": "Bemowo / Conrada", "cat": "mieszkaniowa", "ev": 30, "lat": 52.26822366666667, "lon": 20.935143999999998, "why": "Obszar położony jest w Bemowie, wzdłuż ulicy Conrada, co potwierdzają liczne supermarkety (Lidl, Biedronka) i stacje paliw w otoczeniu osiedli.", "col": "#2a9d8f"}, {"c": 4, "name": "Szeligi / Szeligowska", "cat": "mieszkaniowa", "ev": 30, "lat": 52.22823266666667, "lon": 20.876843, "why": "Rejon zlokalizowany w Szeligach, w pobliżu przystanków komunikacji miejskiej 'Szeligowska-Szkoła', co wskazuje na charakter mieszkalny z punktami użyteczności publicznej.", "col": "#2a9d8f"}, {"c": 11, "name": "Żerań FSO", "cat": "transport_publiczny", "ev": 28, "lat": 52.291176428571426, "lon": 21.00193214285714, "why": "Obszar koncentruje się wokół dworca autobusowego Żerań FSO, co potwierdzają liczne przystanki komunikacji miejskiej, hotel i uczelnia w pobliżu.", "col": "#1d3557"}, {"c": 30, "name": "Bielany AWF / IMGW", "cat": "edukacja", "ev": 28, "lat": 52.28127035714285, "lon": 20.95801392857143, "why": "Rejon zlokalizowany w Bielanach, w pobliżu Akademii Wychowania Fizycznego (AWF) i IMGW, co potwierdzają nazwy pobliskich przystanków.", "col": "#457b9d"}, {"c": 1, "name": "Lewandów / Pasaż Derby", "cat": "handel", "ev": 27, "lat": 52.310472222222224, "lon": 21.06077666666667, "why": "Rejon zlokalizowany jest w Lewandowie, w pobliżu pasażu handlowego Derby oraz licznych supermarketów (Aldi, Lidl, Czerwona Torebka), co wskazuje na dominującą funkcję handlową.", "col": "#e63946"}, {"c": 26, "name": "Białołęka / Annopol", "cat": "mieszane", "ev": 23, "lat": 52.29997, "lon": 21.02977086956522, "why": "Obszar położony jest w Białołęce, przy węźle Modlińska i Factory Annopol, co potwierdzają pobliskie supermarkety, stacje paliw i Wyższa Szkoła Bankowa.", "col": "#8d99ae"}];const map=L.map('map').setView([52.25,20.95],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
pts.forEach(p=>{const r=6+Math.sqrt(p.ev);
 L.circleMarker([p.lat,p.lon],{radius:r,color:'#222',weight:1,fillColor:p.col,fillOpacity:0.85})
  .bindPopup(`<b>${p.name}</b> <span style="color:#888">(${p.c})</span><br><b>${p.ev}</b> przejazdow &middot; <i>${p.cat}</i><br><br>${p.why}`)
  .bindTooltip(p.name,{permanent:true,direction:'right',className:'lbl',offset:[r,0]}).addTo(map);});
